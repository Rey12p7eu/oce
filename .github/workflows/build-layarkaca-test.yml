name: Build & Publish LayarKaca Fixed

on:
  workflow_dispatch:
  push:
    branches:
      - fix-layarkaca

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Prepare JitPack
        run: |
          BASE="$GITHUB_WORKSPACE/jitpack-local/com/github/recloudstream/gradle"
          LOCAL_REPO="$BASE/gradle/master-SNAPSHOT"

          mkdir -p "$LOCAL_REPO"

          curl -sL "https://jitpack.io/com/github/recloudstream/gradle/gradle/master-81b1d424d2-1/gradle-master-81b1d424d2-1.jar" \
            -o "$LOCAL_REPO/gradle-master-SNAPSHOT.jar"

          curl -sL "https://jitpack.io/com/github/recloudstream/gradle/gradle/master-81b1d424d2-1/gradle-master-81b1d424d2-1.pom" \
            -o "$LOCAL_REPO/gradle-master-SNAPSHOT.pom"

          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<metadata>' \
            '  <groupId>com.github.recloudstream.gradle</groupId>' \
            '  <artifactId>gradle</artifactId>' \
            '  <version>master-SNAPSHOT</version>' \
            '  <versioning>' \
            '    <snapshot><localCopy>true</localCopy></snapshot>' \
            '  </versioning>' \
            '</metadata>' > "$LOCAL_REPO/maven-metadata-local.xml"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: adopt
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Set build version
        run: |
          echo "BUILD_TIMESTAMP=$(TZ='Asia/Jakarta' date +'%Y-%m-%d %H:%M')" >> "$GITHUB_ENV"
          echo "OCE_VERSION=$(($(date +%s) / 60))" >> "$GITHUB_ENV"

      - name: Build plugins
        env:
          OCE_REPO_URL: https://github.com/${{ github.repository }}
        run: |
          chmod +x gradlew
          ./gradlew make makePluginsJson --stacktrace

      - name: Prepare LayarKaca repository
        run: |
          mkdir -p dist

          cp ProviderLayarKaca21/build/*.cs3 dist/ProviderLayarKaca21.cs3

          jq '[.[] | select(.internalName == "ProviderLayarKaca21")]' \
            build/plugins.json > dist/plugins.json

          cat > dist/repo.json <<EOF
          {
            "name": "LayarKaca Fixed",
            "description": "LayarKaca21 custom fixed repository",
            "manifestVersion": 1,
            "pluginLists": [
              "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/builds/plugins.json"
            ]
          }
          EOF

      - name: Publish builds branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b builds
          git add .
          git commit -m "Publish LayarKaca fixed"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin builds
